name: kb-prior-art

# Run a prior-art check from the Actions tab: searches the KB, sibling KBs, GitHub repos, Terraform/HCL code
# and issues for a topic and writes the report to the job summary.

on:
  workflow_dispatch:
    inputs:
      query:
        description: What are you about to build? (e.g. "nerdio host pool")
        required: true

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUERY: ${{ inputs.query }}
        run: python3 scripts/kb/prior_art.py "$QUERY"
