name: kb-prior-art

# Run a prior-art check from the Actions tab: searches the KB, sibling KBs, GitHub repos, Terraform/HCL code
# and issues for a topic and writes the report to the job summary.

on:
  workflow_dispatch:
    inputs:
      query:
        description: What are you about to build? (e.g. "nerdio host pool")
        required: true

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Search
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUERY: ${{ inputs.query }}
        run: python3 scripts/kb/prior_art.py "$QUERY"
