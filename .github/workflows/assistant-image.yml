name: assistant-image

# Builds the setup chatbot's container. Pull requests only build it; main publishes it to GHCR,
# where ./nerdio assistant pulls it from by default.

on:
  pull_request:
    paths: [assistant/**, scripts/nerdio/**, schema/**, docs/**, environments/example/**, modules/nerdio-config/variables.tf]
  push:
    branches: [main]
    paths: [assistant/**, scripts/nerdio/**, schema/**, docs/**, environments/example/**, modules/nerdio-config/variables.tf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nerdio-hcl-assistant" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: assistant/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.ref }}:main
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
