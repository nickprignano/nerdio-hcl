name: assistant-image

# Builds the setup chatbot's container. Pull requests only build it; main publishes it to GHCR,
# where ./nerdio assistant pulls it from by default.

on:
  pull_request:
    paths: [assistant/**, scripts/nerdio/**, schema/**, docs/**, environments/example/**, modules/nerdio-config/variables.tf]
  push:
    branches: [main]
    paths: [assistant/**, scripts/nerdio/**, schema/**, docs/**, environments/example/**, modules/nerdio-config/variables.tf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nerdio-hcl-assistant" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: assistant/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.ref }}:main
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
