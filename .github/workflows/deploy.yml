name: deploy
# The setup chatbot reads this title to tell runs apart.
run-name: "${{ inputs.environment }} ${{ inputs.stage }}: ${{ (inputs.stage == 'preflight' || inputs.stage == 'verify') && 'readiness check' || inputs.apply && 'plan and apply' || 'plan' }}"

# Plan, then apply after a reviewer approves (decision 0016). Start it from the Actions tab or
# the setup chatbot. The plan job signs in as the read-only plan identity. The apply job
# waits in the <environment>-apply GitHub environment until a named reviewer approves, then
# applies exactly the saved plan: its hash is checked and Terraform refuses a stale one.
# One-time setup: scripts/pipeline-bootstrap.sh from Cloud Shell (docs/pipeline.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment?"
        required: true
        type: choice
        options:
          - sandbox
          - dev
          - prod
        default: sandbox
      stage:
        description: "Which stage? platform (01) first, then config (02). preflight checks readiness before, verify after Nerdio's wizard."
        required: true
        type: choice
        options:
          - platform
          - config
          - preflight
          - verify
        default: platform
      apply:
        description: "Apply after the plan? A reviewer still has to approve it."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# One run per environment at a time; Terraform's state lock backs this up.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  STAGE: ${{ inputs.stage }}
  NERDIO_ENV: ${{ inputs.environment }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      plan_blob: ${{ steps.plan.outputs.plan_blob }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    # Environment secrets, so GitHub masks every ID in the logs.
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      NERDIO_PLAN_PRINCIPAL_ID: ${{ secrets.NERDIO_PLAN_PRINCIPAL_ID }}
      NERDIO_APPLY_PRINCIPAL_ID: ${{ secrets.NERDIO_APPLY_PRINCIPAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      # az signs in for group lookups and the plan upload; Terraform gets its own OIDC tokens.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/pipeline/stage.sh plan

  apply:
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # The gate: GitHub holds this job until a reviewer approves, and only then issues the token
    # the apply identity trusts.
    environment: ${{ inputs.environment }}-apply
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      NERDIO_PLAN_PRINCIPAL_ID: ${{ secrets.NERDIO_PLAN_PRINCIPAL_ID }}
      NERDIO_APPLY_PRINCIPAL_ID: ${{ secrets.NERDIO_APPLY_PRINCIPAL_ID }}
      PLAN_BLOB: ${{ needs.plan.outputs.plan_blob }}
      PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/pipeline/stage.sh apply
