name: deploy
# The setup chatbot reads this title to tell runs apart.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0} {1}: {2}', inputs.environment, inputs.stage, (inputs.stage == 'preflight' || inputs.stage == 'verify') && 'readiness check' || (inputs.stage == 'fix-quota' || inputs.stage == 'fix-vcpu') && (inputs.apply && 'plan and request quota' || 'plan quota request') || inputs.apply && 'plan and apply' || 'plan') || format('gitops ({0}): {1}', github.event_name, github.ref_name) }}"

# Plan, then apply after a reviewer approves (decisions 0016, 0030, 0033). Start it from the Actions
# tab, the setup chatbot, or via GitOps PR/push to config/answers/<env>.json. A pull request that
# changes the kit's code (modules, environments, bicep, pipeline scripts) gets a read-only plan
# posted as a comment, once the repository variable NERDIO_PR_PLAN_ENV names an environment whose
# plan environment allows pull requests (github.allow_pr_plans).
# Each stage runs in the reusable stage.yml. The plan job signs in as
# the read-only plan identity. The apply job waits in the <environment>-apply GitHub environment
# until a named reviewer approves, then applies exactly the saved plan: its hash is checked and
# Terraform refuses a stale one.
# One-time setup: scripts/pipeline/bootstrap.sh from Cloud Shell (docs/pipeline.md).

on:
  pull_request:
    branches: [main]
    paths:
      - "config/answers/*.json"
      - "modules/**"
      - "environments/example/**"
      - "bicep/**"
      - "scripts/pipeline/**"
      - "schema/parameters.json"
  push:
    branches: [main]
    paths:
      - "config/answers/*.json"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment?"
        required: true
        type: choice
        options:
          - sandbox
          - dev
          - prod
        default: sandbox
      stage:
        description: "Which stage? platform (01) first, then config (02), auto (platform then config), or assistant (00). bicep deploys the platform from the Bicep variant. preflight/verify check readiness; fix-quota/fix-vcpu request quota."
        required: true
        type: choice
        options:
          - platform
          - config
          - auto
          - assistant
          - bicep
          - preflight
          - verify
          - fix-quota
          - fix-vcpu
        default: platform
      apply:
        description: "Apply after the plan? A reviewer still has to approve it."
        required: true
        type: boolean
        default: false
      allow_replace:
        description: "Allow plans that delete or replace stateful Stage 1 / Stage 2 resources when destroy=false?"
        required: false
        type: boolean
        default: false
      destroy:
        description: "Plan a teardown (-destroy) of the chosen stage? Requires platform, config or assistant."
        required: false
        type: boolean
        default: false
      unlock_lock_id:
        description: "Force-unlock a stuck Terraform state lock ID (UUID)? Runs in the gated apply environment."
        required: false
        type: string
        default: ""
      runner_labels:
        description: "Optional runner labels override (JSON array or comma-separated, e.g. self-hosted,linux,x64,vnet). Blank uses environment var NERDIO_RUNNER_LABELS or ubuntu-latest."
        required: false
        type: string
        default: ""
      fix_family:
        description: "For fix-vcpu: VM family quota name (e.g. standardDSv5Family). Leave blank to infer from vm_size in answers."
        required: false
        type: string
        default: ""
      fix_limit:
        description: "For fix-quota or fix-vcpu: new quota limit to request. Leave blank to infer from answers."
        required: false
        type: string
        default: ""
      fix_contact:
        description: "For fix-quota: support contact email or email,COUNTRY (e.g. admin@contoso.com,USA) if Entra user lookup lacks it."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One run per environment/ref at a time; Terraform's state lock backs this up.
concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ctx.outputs.run }}
      environment: ${{ steps.ctx.outputs.environment }}
      stage: ${{ steps.ctx.outputs.stage }}
      apply: ${{ steps.ctx.outputs.apply }}
      runner_override: ${{ steps.ctx.outputs.runner_override }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: resolve target environment and stage
        id: ctx
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_ENV: ${{ inputs.environment }}
          IN_STAGE: ${{ inputs.stage }}
          IN_APPLY: ${{ inputs.apply && 'true' || 'false' }}
          IN_RUNNER: ${{ inputs.runner_labels }}
          PR_PLAN_ENV: ${{ vars.NERDIO_PR_PLAN_ENV }}
          # A fork's pull request gets no OIDC token or secrets; skip it instead of failing.
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          run=true
          if [ "$EVENT" = workflow_dispatch ]; then
            env_name="$IN_ENV"
            stage_name="$IN_STAGE"
            do_apply="$IN_APPLY"
          else
            changed="$(git diff --name-only HEAD~1 HEAD -- 'config/answers/*.json' 2>/dev/null | head -n1 || true)"
            if [ -n "$changed" ]; then
              env_name="$(basename "$changed" .json)"
            else
              # A code change: plan the environment named in NERDIO_PR_PLAN_ENV. Unset means off,
              # so a repository without a bootstrapped pipeline doesn't get a failing plan on every PR.
              env_name="${PR_PLAN_ENV:-sandbox}"
              [ -n "$PR_PLAN_ENV" ] || run=false
            fi
            stage_name="auto"
            if git diff --name-only HEAD~1 HEAD -- 'bicep/**' | grep -q . \
              && ! git diff --name-only HEAD~1 HEAD -- 'modules/**' 'environments/example/**' 'config/answers/*.json' | grep -q .; then
              stage_name="bicep"
            fi
            if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ -n "$changed" ]; then
              do_apply="true"   # merged answers: plan and wait for a reviewer (GitOps, decision 0030)
            else
              do_apply="false"  # a pull request, or merged code: plan only
            fi
          fi
          [ "$SAME_REPO" = true ] || run=false
          [[ "$env_name" =~ ^[a-z][a-z0-9-]{1,20}$ ]] || { echo "::error::bad environment name"; exit 1; }
          runner_json=""
          if [ -n "$IN_RUNNER" ]; then
            if [[ "$IN_RUNNER" == \[* ]]; then
              runner_json="$(jq -c . <<<"$IN_RUNNER")"
            else
              runner_json="$(printf '%s' "$IN_RUNNER" | tr ',' '\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | jq -R . | jq -cs 'map(select(. != ""))')"
            fi
          fi
          {
            echo "run=$run"
            echo "environment=$env_name"
            echo "stage=$stage_name"
            echo "apply=$do_apply"
            echo "runner_override=$runner_json"
          } >> "$GITHUB_OUTPUT"

  plan:
    needs: detect
    if: needs.detect.outputs.run == 'true' && inputs.unlock_lock_id == ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
      stage: ${{ needs.detect.outputs.stage == 'auto' && 'platform' || needs.detect.outputs.stage }}
      action: plan
      runner: ${{ needs.detect.outputs.runner_override }}
      destroy: ${{ inputs.destroy == true }}
      allow_replace: ${{ inputs.allow_replace == true }}
      fix_family: ${{ inputs.fix_family }}
      fix_limit: ${{ inputs.fix_limit }}
      fix_contact: ${{ inputs.fix_contact }}

  apply:
    needs: [detect, plan]
    if: needs.detect.outputs.apply == 'true' && needs.plan.outputs.changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
      stage: ${{ needs.detect.outputs.stage == 'auto' && 'platform' || needs.detect.outputs.stage }}
      action: apply
      runner: ${{ needs.detect.outputs.runner_override }}
      plan_blob: ${{ needs.plan.outputs.plan_blob }}
      plan_sha256: ${{ needs.plan.outputs.plan_sha256 }}
      destroy: ${{ inputs.destroy == true }}
      fix_family: ${{ inputs.fix_family }}
      fix_limit: ${{ inputs.fix_limit }}
      fix_contact: ${{ inputs.fix_contact }}

  plan-config:
    needs: [detect, plan, apply]
    if: |
      always() &&
      needs.detect.outputs.stage == 'auto' &&
      needs.plan.result == 'success' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
      stage: config
      action: plan
      runner: ${{ needs.detect.outputs.runner_override }}
      skip_missing_platform: true

  apply-config:
    needs: [detect, plan-config]
    if: always() && needs.detect.outputs.apply == 'true' && needs.plan-config.outputs.changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
      stage: config
      action: apply
      runner: ${{ needs.detect.outputs.runner_override }}
      plan_blob: ${{ needs.plan-config.outputs.plan_blob }}
      plan_sha256: ${{ needs.plan-config.outputs.plan_sha256 }}

  unlock:
    needs: detect
    if: inputs.unlock_lock_id != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage.yml
    with:
      environment: ${{ needs.detect.outputs.environment }}
      stage: ${{ needs.detect.outputs.stage == 'auto' && 'platform' || needs.detect.outputs.stage }}
      action: unlock
      runner: ${{ needs.detect.outputs.runner_override }}
      lock_id: ${{ inputs.unlock_lock_id }}

  # The plan as a pull request comment, updated in place on each push. No Azure access here: it
  # posts the summary the plan jobs already masked.
  comment:
    needs: [detect, plan, plan-config]
    if: always() && github.event_name == 'pull_request' && needs.detect.outputs.run == 'true' && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: post or update the plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ENV_NAME: ${{ needs.detect.outputs.environment }}
          PLAN_RESULT: ${{ needs.plan.result }}
          CONFIG_RESULT: ${{ needs.plan-config.result }}
          PLAN_MD: ${{ needs.plan.outputs.summary_md }}
          CONFIG_MD: ${{ needs.plan-config.outputs.summary_md }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- nerdio-plan:$ENV_NAME -->"
          {
            echo "$marker"
            echo "### Read-only plan for \`$ENV_NAME\`"
            echo
            echo "Nothing is applied from a pull request. Merge, then run **deploy** with apply ticked; a reviewer approves the apply."
            echo
            if [ -n "$PLAN_MD" ]; then echo "$PLAN_MD"; else echo "Plan job: **$PLAN_RESULT** (see the run)."; fi
            echo
            if [ -n "$CONFIG_MD" ]; then echo "$CONFIG_MD"; elif [ "$CONFIG_RESULT" != skipped ]; then echo "Config plan: **$CONFIG_RESULT**."; fi
            echo
            echo "[Run]($RUN_URL)"
          } > body.md
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
