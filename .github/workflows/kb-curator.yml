name: kb-curator

# Weekly digest of new releases, docs and community repos from docs/knowledge/sources.toml,
# opened as an issue labelled kb-digest. On pull requests that touch the curator it runs as a
# dry run and writes the digest to the job summary instead.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: Look back this many days
        default: "8"
  pull_request:
    paths:
      - scripts/kb/**
      - docs/knowledge/sources.toml
      - .github/workflows/kb-curator.yml

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Collect
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE_DAYS: ${{ inputs.since_days || '8' }}
        run: python3 scripts/kb/curate.py --since-days "$SINCE_DAYS" --output digest.md
      - name: Job summary
        run: cat digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open digest issue and supersede unticked older digests
        if: github.event_name != 'pull_request' && steps.collect.outputs.items != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create kb-digest --color 0e8a16 --description "Knowledge base curator digest" --force
          old_open=$(gh issue list --label kb-digest --state open --json number,body)
          new_url=$(gh issue create --label kb-digest --title "KB digest: $(date -u +%F)" --body-file digest.md)
          echo "Opened $new_url"
          echo "$old_open" | jq -r '.[] | select((.body // "") | test("(^|\n)- \\[[xX]\\]") | not) | .number' | while read -r num; do
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "Superseded by $new_url (no items were ticked)."
            fi
          done
      # Runs every week, even when nothing new was found. A digest with ticked items that never got
      # the kb-accepted label would otherwise stay open forever. kb-accepted ones are left alone:
      # their kb-feedback pull request closes them when it merges.
      - name: Close stale digests that were never accepted
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_DAYS: "28"
        run: |
          cutoff=$(date -u -d "$STALE_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --label kb-digest --state open --limit 100 --json number,createdAt,labels \
            | jq -r --arg cutoff "$cutoff" \
                '.[] | select(.createdAt < $cutoff) | select([.labels[].name] | index("kb-accepted") | not) | .number' \
            | while read -r num; do
                if [ -n "$num" ]; then
                  gh issue close "$num" --reason "not planned" --comment "Closed after $STALE_DAYS days without the kb-accepted label. To keep the ticked items, reopen this issue and add kb-accepted."
                fi
              done
