name: kb-curator

# Weekly digest of new releases, docs and community repos from docs/knowledge/sources.toml,
# opened as an issue labelled kb-digest. On pull requests that touch the curator it runs as a
# dry run and writes the digest to the job summary instead.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: Look back this many days
        default: "8"
  pull_request:
    paths:
      - scripts/kb/**
      - docs/knowledge/sources.toml
      - .github/workflows/kb-curator.yml

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Collect
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE_DAYS: ${{ inputs.since_days || '8' }}
        run: python3 scripts/kb/curate.py --since-days "$SINCE_DAYS" --output digest.md
      - name: Job summary
        run: cat digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open digest issue and supersede unticked older digests
        if: github.event_name != 'pull_request' && steps.collect.outputs.items != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create kb-digest --color 0e8a16 --description "Knowledge base curator digest" --force
          old_open=$(gh issue list --label kb-digest --state open --json number,body)
          new_url=$(gh issue create --label kb-digest --title "KB digest: $(date -u +%F)" --body-file digest.md)
          echo "Opened $new_url"
          echo "$old_open" | jq -r '.[] | select((.body // "") | test("(^|\n)- \\[[xX]\\]") | not) | .number' | while read -r num; do
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "Superseded by $new_url (no items were ticked)."
            fi
          done
