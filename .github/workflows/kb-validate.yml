name: kb-validate

# Checks the knowledge base on every change to it: front matter and YAML against the JSON Schemas,
# MADR decision records, links and anchors, leak patterns, generated files (indexes, tables,
# llms.txt) in sync, and the KB scripts' unit tests. Secrets are covered by gitleaks in validate.yml.

on:
  pull_request:
    paths:
      - docs/knowledge/**
      - scripts/kb/**
      - llms.txt
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/kb-*.yml
  push:
    branches: [main]
    paths:
      - docs/knowledge/**
      - scripts/kb/**
      - llms.txt

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/kb/requirements.txt
      - name: Schema, links and leak patterns
        run: python3 scripts/kb/validate.py
      - name: Generated files in sync
        run: python3 scripts/kb/build.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/kb -v
