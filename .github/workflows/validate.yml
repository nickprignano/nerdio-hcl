name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Explicit bash gives -eo pipefail, so piping through tee keeps failures.
defaults:
  run:
    shell: bash

jobs:
  bicep:
    # Bicep variant of stage 1 (decision 0032): compile and lint against every example answer set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install Bicep
        run: az bicep install --version v0.37.4 && az bicep version
      - name: build and lint
        run: |
          for f in bicep/main.bicep bicep/identity.bicep; do
            az bicep build --file "$f" --stdout >/dev/null
            az bicep lint --file "$f"
          done
      - name: build params from each example answer set
        run: |
          for example in schema/examples/*.json; do
            echo "::group::$example"
            # Render the answer set the way ./nerdio init does, with placeholder IDs, into the gitignored answers file.
            python3 -c 'import json, sys; sys.path.insert(0, "scripts/nerdio"); import engine; s = engine.load_schema(); r = engine.resolve(s, json.load(open(sys.argv[1])), engine.read_sources(placeholders=True)); out, _ = engine.render(s, r, placeholders=True); engine.write_tfvars(s, out, "example")' "$example"
            for p in bicep/environments/example/*.bicepparam; do
              az bicep build-params --file "$p" --stdout >/dev/null
            done
            echo "::endgroup::"
          done
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
      - name: fmt
        run: terraform fmt -recursive -check -diff
      - name: validate platform stage
        working-directory: environments/example/01-platform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate assistant stage
        working-directory: environments/example/00-assistant
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate deploy pipeline stage
        working-directory: environments/example/00-pipeline
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: install nerdio/nme provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-nme-provider.sh 2>&1 | tee install.log || { tail -n 10 install.log | sed 's/^/::error::/'; exit 1; }
      - name: validate Nerdio config stage (nerdio/nme provider)
        working-directory: environments/example/02-nerdio-config
        # nerdio/nme comes from the local plugin directory the install script wrote; azurerm and
        # vault come from the Registry, so a plain init works.
        run: |
          terraform init -backend=false -input=false -no-color >/dev/null
          terraform validate -no-color 2>&1 | tee validate.log || { grep -v '^$' validate.log | tail -n 8 | sed 's/^/::error::/'; exit 1; }
      - name: module tests
        run: |
          for dir in modules/assistant modules/avd-insights modules/network modules/nerdio-core modules/nerdio-secrets modules/openbao modules/automation-workers modules/cmk-encryption modules/nerdio-rbac modules/vnet-runner modules/deploy-pipeline modules/github-settings github environments/example/01-platform; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          # tflint --init downloads rulesets from the GitHub API; unauthenticated calls hit the
          # shared runner IP's rate limit (403). The workflow token raises it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error
      - name: trivy IaC security scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.58.1 config \
            --misconfig-scanners terraform \
            --tf-exclude-downloaded-modules \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 1 \
            .
      - name: shellcheck pipeline scripts
        run: shellcheck scripts/pipeline/*.sh github/settings.sh

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: engine unit tests
        run: python3 -m unittest discover -s scripts/nerdio -v
      - name: assistant unit tests
        run: |
          python3 -m pip install -q -r assistant/requirements.txt
          python3 -m unittest discover -s assistant -v
      - name: MCP server and AI tool-boundary tests (decision 0031)
        run: python3 -m unittest discover -s scripts/mcp -v
      - name: schema matches the Terraform variables and the Actions form
        run: ./nerdio schema check

  preflight-zipapp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Azure Cloud Shell's Python; the standalone check must run there.
          python-version: "3.9"
      - name: readiness tests on Python 3.9
        working-directory: scripts/nerdio
        run: python3 -m unittest -v test_readiness test_standalone test_redact
      - name: build twice, same bytes
        run: |
          a="$(python3 scripts/build-preflight-pyz.py --out dist/a.pyz)"
          b="$(python3 scripts/build-preflight-pyz.py --out dist/b.pyz)"
          echo "$a"
          [ "${a%% *}" = "${b%% *}" ] || { echo "::error::the zipapp build isn't reproducible"; exit 1; }
      - name: smoke test
        working-directory: dist
        run: |
          python3 -I a.pyz --version
          python3 -I a.pyz --list > /dev/null
          python3 -I a.pyz --no-input --format md > smoke.md || [ $? -le 3 ]
          head -n 3 smoke.md

  # The deploy, stage and drift workflows hold the apply identity's gate, so lint them on every
  # pull request; and build the Bicep variant when it's in the tree (decision 0033).
  pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          curl -sSfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tgz" | sha256sum --check --quiet -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: bicep build and lint
        if: hashFiles('bicep/main.bicep') != ''
        run: |
          az bicep install --only-show-errors
          az bicep build --file bicep/main.bicep --stdout > /dev/null
          az bicep lint --file bicep/main.bicep

  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.16.1"
      - name: init, fmt, validate
        working-directory: packer/avd-win11
        run: |
          packer init .
          packer fmt -check -diff .
          packer validate -var-file=example.pkrvars.hcl .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: no tenant files tracked
        # Guardrail 4 (docs/guardrails.md): real values live only in gitignored files.
        run: |
          bad="$(git ls-files | grep -E '(\.tfvars|\.tfvars\.json|\.pkrvars\.hcl|\.tfstate(\..*)?|\.tfplan|\.plan|\.terraformrc|\.env(\..*)?|\.pem|\.pfx|\.p12|\.key)$' \
            | grep -vE '(\.tfvars\.example|/example\.pkrvars\.hcl|\.env\.example)$' || true)"
          if [ -n "$bad" ]; then
            # shellcheck disable=SC2086 # one annotation per file: split on purpose
            printf '::error file=%s::Tenant-specific file is tracked; remove it and keep it gitignored (docs/guardrails.md)\n' $bad
            exit 1
          fi
          for f in config/answers/*.json; do
            [ -f "$f" ] || continue
            guids="$(grep -oE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$f" | grep -v '^00000000-0000-0000-0000-000000000000$' || true)"
            if [ -n "$guids" ]; then
              printf '::error file=%s::GitOps answer file contains non-zero GUID(s); use group display names and omit tenant/subscription IDs (docs/guardrails.md)\n' "$f"
              exit 1
            fi
          done
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --exit-code 1 \
            --report-format json --report-path /repo/gitleaks.json 2>&1 | tee gitleaks.log && exit 0
          if [ -s gitleaks.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:7])"' gitleaks.json
          else
            tail -n 8 gitleaks.log | sed 's/^/::error::/'
          fi
          exit 1
