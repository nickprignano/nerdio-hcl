# Known errors catalog: the source of truth for troubleshooting/README.md.
# Regenerate the page with `python3 scripts/kb/build.py`. Schema: ../schema/known-errors.schema.json
# `source` is a KB path (relative to docs/knowledge/) or an https URL.

errors:
- id: azurerm5-subnet-service-endpoints
  symptom: '`An argument named "service_endpoints" is not expected here.` on `azurerm_subnet`'
  cause: azurerm 5.x replaced the list argument with blocks
  fix: Use repeatable `service_endpoint { service = "..." }` blocks
  source: terraform/azurerm-5.md#breaking-changes-and-fixes
  status: verified
  added: '2026-10-16'
- id: azurerm5-dns-link-zone-id
  symptom: '`The argument "private_dns_zone_id" is required` on a private DNS zone VNet link'
  cause: azurerm 5.x changed how the zone is referenced
  fix: Set `private_dns_zone_id`; drop `resource_group_name` and `private_dns_zone_name`
  source: terraform/azurerm-5.md#breaking-changes-and-fixes
  status: verified
  added: '2026-10-16'
- id: azurerm5-storage-public-network-access
  symptom: '`public_network_access_enabled` deprecation warning on `azurerm_storage_account`'
  cause: Renamed in azurerm 5.x, removed in 6.0
  fix: Use `public_network_access = "Disabled"`
  source: terraform/azurerm-5.md#breaking-changes-and-fixes
  status: verified
  added: '2026-10-16'
- id: registry-blocked
  symptom: '`terraform init` can''t download providers or Packer plugins'
  cause: Registry blocked by the network
  fix: Use a `filesystem_mirror` or a local plugin path
  source: terraform/restricted-networks.md
  status: verified
  added: '2026-10-16'
- id: nerdio-scripted-actions-private-storage
  symptom: Nerdio Azure runbook scripted actions fail after hardening
  cause: The scripted-actions storage account was made private
  fix: Use a Hybrid Runbook Worker, or leave that account public
  source: nerdio/platform.md#hardening-private-endpoints
  status: verified
  added: '2026-10-16'
- id: nme-dev-overrides-blocks-init
  symptom: '`terraform init` in 02-nerdio-config fails with "Could not retrieve the list of available versions for provider nerdio/nme", or plan says "Inconsistent dependency lock file"'
  cause: '`~/.terraformrc` still has the old `dev_overrides` entry for nerdio/nme; stage 2 now also needs Registry providers, so it uses `terraform init`'
  fix: Run `scripts/install-nme-provider.sh` again; it replaces the old block with a local plugin directory (a backup is kept as `.terraformrc.bak`)
  source: https://developer.hashicorp.com/terraform/cli/config/config-file#development-overrides-for-provider-developers
  status: verified
  added: '2026-10-16'
- id: cloud-shell-reset-stops-terraform
  symptom: Cloud Shell shows "Requesting a Cloud Shell" mid-apply or mid-destroy, and a rerun stops with `Error acquiring the state lock`
  cause: Cloud Shell closes after about 20 minutes without a keypress, or when a tablet sleeps the tab. A run that was waiting at its "yes" prompt can survive and keep holding the lock
  fix: Check `pgrep -a terraform` first. If a run is still there, stop it with `kill -INT <pid>`; if none is, `terraform force-unlock -force "$(jq -r .ID .terraform.tfstate.lock.info)"`. For long runs, review a saved plan (`terraform plan -destroy -out=destroy.tfplan`) and apply it with `nohup terraform apply destroy.tfplan > ~/destroy.log 2>&1 &`. The lasting fix is the deploy pipeline
  source: chatbot-first.md
  status: unverified
  added: '2026-10-17'
- id: smart-detection-action-group-blocks-destroy
  symptom: A destroy fails on the Nerdio resource group with `the Resource Group still contains Resources`, naming `microsoft.insights/actiongroups/Application Insights Smart Detection`
  cause: Azure creates that action group by itself when Application Insights is created, so it was never in Terraform's state. The azurerm provider refuses to delete a resource group that still holds resources it doesn't manage
  fix: Check that it is the only resource listed, then `az monitor action-group delete -g <group> -n "Application Insights Smart Detection"`, plan the destroy again and apply it. Don't turn off `prevent_deletion_if_contains_resources` to get past it; that check is what caught it
  source: chatbot-first.md
  status: verified
  added: '2026-10-17'
