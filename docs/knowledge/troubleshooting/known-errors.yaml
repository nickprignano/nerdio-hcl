# Known errors catalog: the source of truth for troubleshooting/README.md.
# Regenerate the page with `python3 scripts/kb/build.py`. Schema: ../schema/known-errors.schema.json
# `source` is a KB path (relative to docs/knowledge/) or an https URL.

errors:
- id: azurerm5-subnet-service-endpoints
  symptom: '`An argument named "service_endpoints" is not expected here.` on `azurerm_subnet`'
  cause: azurerm 5.x replaced the list argument with blocks
  fix: Use repeatable `service_endpoint { service = "..." }` blocks
  source: terraform/azurerm-5.md#breaking-changes-and-fixes
  status: verified
  added: '2026-10-16'
- id: azurerm5-dns-link-zone-id
  symptom: '`The argument "private_dns_zone_id" is required` on a private DNS zone VNet link'
  cause: azurerm 5.x changed how the zone is referenced
  fix: Set `private_dns_zone_id`; drop `resource_group_name` and `private_dns_zone_name`
  source: terraform/azurerm-5.md#breaking-changes-and-fixes
  status: verified
  added: '2026-10-16'
- id: azurerm5-storage-public-network-access
  symptom: '`public_network_access_enabled` deprecation warning on `azurerm_storage_account`'
  cause: Renamed in azurerm 5.x, removed in 6.0
  fix: Use `public_network_access = "Disabled"`
  source: terraform/azurerm-5.md#breaking-changes-and-fixes
  status: verified
  added: '2026-10-16'
- id: registry-blocked
  symptom: '`terraform init` can''t download providers or Packer plugins'
  cause: Registry blocked by the network
  fix: Use a `filesystem_mirror` or a local plugin path
  source: terraform/restricted-networks.md
  status: verified
  added: '2026-10-16'
- id: nerdio-scripted-actions-private-storage
  symptom: Nerdio Azure runbook scripted actions fail after hardening
  cause: The scripted-actions storage account was made private
  fix: Use a Hybrid Runbook Worker, or leave that account public
  source: nerdio/platform.md#hardening-private-endpoints
  status: verified
  added: '2026-10-16'
- id: nme-dev-overrides-blocks-init
  symptom: '`terraform init` in 02-nerdio-config fails with "Could not retrieve the list of available versions for provider nerdio/nme", or plan says "Inconsistent dependency lock file"'
  cause: '`~/.terraformrc` still has the old `dev_overrides` entry for nerdio/nme; stage 2 now also needs Registry providers, so it uses `terraform init`'
  fix: Run `scripts/install-nme-provider.sh` again; it replaces the old block with a local plugin directory (a backup is kept as `.terraformrc.bak`)
  source: https://developer.hashicorp.com/terraform/cli/config/config-file#development-overrides-for-provider-developers
  status: verified
  added: '2026-10-16'
- id: cloud-shell-reset-stops-terraform
  symptom: Cloud Shell shows "Requesting a Cloud Shell" mid-apply or mid-destroy, and a rerun stops with `Error acquiring the state lock`
  cause: Cloud Shell closes after about 20 minutes without a keypress, or when a tablet sleeps the tab. A run that was waiting at its "yes" prompt can survive and keep holding the lock
  fix: Check `pgrep -a terraform` first. If a run is still there, stop it with `kill -INT <pid>`; if none is, `terraform force-unlock -force "$(jq -r .ID .terraform.tfstate.lock.info)"`. For long runs, review a saved plan (`terraform plan -destroy -out=destroy.tfplan`) and apply it with `nohup terraform apply destroy.tfplan > ~/destroy.log 2>&1 &`. The lasting fix is the deploy pipeline
  source: chatbot-first.md
  status: verified
  added: '2026-10-17'
- id: smart-detection-action-group-blocks-destroy
  symptom: A destroy fails on the Nerdio resource group with `the Resource Group still contains Resources`, naming `microsoft.insights/actiongroups/Application Insights Smart Detection`
  cause: Azure creates that action group by itself when Application Insights is created, so it was never in Terraform's state. The azurerm provider refuses to delete a resource group that still holds resources it doesn't manage
  fix: Check that it is the only resource listed, then `az monitor action-group delete -g <group> -n "Application Insights Smart Detection"`, plan the destroy again and apply it. Don't turn off `prevent_deletion_if_contains_resources` to get past it; that check is what caught it
  source: chatbot-first.md
  status: verified
  added: '2026-10-17'
- id: app-service-quota-zero
  symptom: '`Operation cannot be completed without additional quota` on the App Service plan; readiness check `sub.app_service` fails'
  cause: The subscription's App Service quota for the plan's tier (B3 by default; more with Insights) is 0 or used up in that region, common on trial and sandbox subscriptions
  fix: '`./nerdio fix quota --sku B3 --location <region> --limit <n>`, or pick a region where `./nerdio preflight --regions` passes'
  source: nerdio/readiness.md
  status: verified
  added: '2026-10-19'
- id: sql-region-does-not-allow-provisioning
  symptom: '`RegionDoesNotAllowProvisioning` creating the SQL server; readiness check `sub.sql` fails'
  cause: The region doesn't accept new SQL servers for this subscription
  fix: Pick another region, or ask Azure Support for region access (Service and subscription limits)
  source: nerdio/readiness.md
  status: verified
  added: '2026-10-19'
- id: app-integration-subnet-not-delegated
  symptom: App Service VNet integration fails on an existing subnet; readiness check `net.subnets` fails
  cause: The integration subnet isn't delegated to Microsoft.Web/serverFarms
  fix: '`az network vnet subnet update --ids <subnet id> --delegations Microsoft.Web/serverFarms`'
  source: nerdio/readiness.md
  status: verified
  added: '2026-10-19'
- id: session-hosts-no-outbound
  symptom: Session hosts never register with AVD; readiness check `net.outbound` fails
  cause: The subnet has no NAT gateway, firewall route or default outbound access (VNets created after 31 March 2026 get none)
  fix: Attach a NAT gateway, or route 0.0.0.0/0 to your firewall
  source: nerdio/readiness.md
  status: verified
  added: '2026-10-19'
- id: pipeline-abac-role-assignment-not-permitted
  symptom: '`RoleAssignmentUpdateNotPermitted` when the deploy pipeline applies a stage that creates an `azurerm_role_assignment`'
  cause: The pipeline's `apply` identity holds `Role Based Access Control Administrator` with an Azure ABAC condition restricting assignable roles to `apply_assignable_roles`, and the target role definition is not in that list
  fix: Add the role name to `apply_assignable_roles` in `modules/deploy-pipeline/variables.tf` (or `access.apply_assignable_roles` in `00-pipeline`) and re-apply `00-pipeline`
  source: terraform/testing-and-ci.md#ci-workflow
  status: verified
  added: '2026-10-27'
- id: terraform-check-block-module-splat-cycle
  symptom: '`Error: Cycle: (execute checks) -> ... -> module.nerdio_core.check.nerdio_health (expand) -> module.nerdio_core (close)` during `terraform plan` or `terraform test` cleanup'
  cause: A downstream managed resource (such as `azurerm_management_lock` or `module.vnet_runner`) references a module splat (`module.nerdio_core[*].<output>`) or depends on outputs of a child module containing a `check` block during a `terraform test` `command = apply` teardown (where resource destroy edges reverse while check edges stay forward)
  fix: 'Index conditional modules directly (`var.nerdio_install == "terraform" ? module.nerdio_core[0].<output> : module.nerdio_manager[0].<output>`), use static plan-time `for_each` keys (`"rg-nerdio"`, `"kv-nme-secrets"`, `"kv-cmk"`, `"fslogix-${k}"`), and lock the parent `nerdio` resource group (`module.foundation.resource_group_ids["nerdio"]`) rather than outputs of `module.nerdio_core`'
  source: terraform/testing-and-ci.md#terraform-test
  status: verified
  added: '2026-10-28'
- id: trivy-config-multiple-targets
  symptom: '`FATAL multiple targets cannot be specified` when running `trivy config` in CI'
  cause: '`trivy config` accepts only a single directory positional argument (`trivy config [flags] DIR`) rather than multiple path arguments'
  fix: 'Pass `.` as the single target directory with `--misconfig-scanners terraform --tf-exclude-downloaded-modules`'
  source: terraform/testing-and-ci.md#ci-workflow
  status: verified
  added: '2026-10-28'
- id: shellcheck-sc2016-single-quoted-backticks
  symptom: '`SC2016 (info): Expressions don''t expand in single quotes, use double quotes for that` on Markdown summary lines in pipeline scripts'
  cause: 'CI runs `shellcheck` at default `info` severity, which flags single-quoted strings containing Markdown code backticks (`echo ''Skipped: `01-platform`''`) as unintended command substitution'
  fix: 'Use Markdown bold (`**01-platform**`) or HTML `<code>...</code>` tags instead of backticks inside shell `echo` strings'
  source: terraform/testing-and-ci.md#ci-workflow
  status: verified
  added: '2026-10-28'
- id: github-settings-drift-missing-app-id
  symptom: '`Error: [@octokit/auth-app] appId option is required` in the daily `GitHub settings drift` workflow (`github-settings-drift.yml`)'
  cause: '`actions/create-github-app-token` runs when `vars.SETTINGS_APP_ID` is not set yet in the `github-settings-read` environment'
  fix: 'Gate `create-github-app-token` and `terraform plan` behind a `check_app` step that verifies `[ -n "${{ vars.SETTINGS_APP_ID }}" ]`, and write setup instructions to `$GITHUB_STEP_SUMMARY` when unset'
  source: terraform/github-settings.md#tests-and-credentials
  status: verified
  added: '2026-10-28'
- id: kb-freshness-false-positive-expert-yield
  symptom: '`KB freshness check` (`kb-freshness`) flags every tracked expert with `nothing in the digests since <date>; check the feed still works` or stays open after all items are fixed'
  cause: '`expert_items()` evaluated digest yield even when `digests` was empty (`[]`) before the first `kb-digest` issue or within 90 days of an expert''s `reviewed` date, and `kb-freshness.yml` had no `items == ''0''` auto-close step'
  fix: 'Skip `Expert yield` in `scripts/kb/freshness.py` when `digests` is empty or `(today - reviewed).days <= max_age_days`, and close open `kb-freshness` issues in `.github/workflows/kb-freshness.yml` when `steps.collect.outputs.items == ''0''`'
  source: curation.md#freshness-check-kb-freshness
  status: verified
  added: '2026-10-28'
- id: kb-curator-youtube-feed-http-500
  symptom: 'Weekly `kb-digest` issues list `Nerdio (YouTube channel): HTTP Error 500: Internal Server Error` under `## Fetch errors`'
  cause: 'YouTube''s Atom feed endpoint (`https://www.youtube.com/feeds/videos.xml?channel_id=...`) intermittently returns transient HTTP 500 responses on the first request'
  fix: 'Retry HTTP 5xx (`500 <= e.code < 600`) once after a short backoff in `scripts/kb/sources.py` (`http_get`)'
  source: curation.md#weekly-digest-kb-curator
  status: verified
  added: '2026-10-28'
