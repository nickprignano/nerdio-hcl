# Related knowledge bases: separate repositories that share a compatible format and stay
# read-only aware of each other ("aware but separate"). This repository owns its own KB and
# format, grounded directly in Nerdio, Microsoft, HashiCorp and community expert sources.
# Schema: schema/family.schema.json. How it works: curation.md#knowledge-base-family

format_version: 1
projects:
- id: nerdio-hcl
  name: Nerdio HCL kit
  self: true
  repo: nickprignano/nerdio-hcl
  kb_path: docs/knowledge
  role: reference
  focus: Nerdio Manager on Azure Virtual Desktop, deployed with Terraform and Packer
  owns: [Nerdio Manager, the nerdio/nme provider, AVD and FSLogix for this kit, this kit's Terraform and Packer, setup chatbot and KB format]
  format_version: 1
- id: ai
  name: AI
  repo: nickprignano/ai-brain
  kb_path: docs/knowledge
  role: member
  format_version: 1
  focus: Standalone AI research and experimentation (watched read-only for awareness)
  owns: [General AI research, model evaluations and AI workflows]
- id: avd
  name: AVD
  repo: nickprignano/avd-second-brain
  kb_path: docs/knowledge
  role: member
  focus: Standalone Azure Virtual Desktop research (watched read-only for awareness)
  owns: [Standalone Azure Virtual Desktop and EUC research]
